---
- name: Bootstrap dev machine with Docker, Nginx, MicroK8s, and AWS CLI
  hosts: all
  become: true

  vars:
    user_name: "{{ ansible_user }}"
    user_home: "/home/{{ ansible_user }}"
    microk8s_channel: "1.31/stable"
    microk8s_addons:
      - dns
      - registry
      - dashboard
      - istio

  tasks:

    # ---------------- System ----------------
    - name: Update and upgrade apt packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - apt-transport-https
          - unzip
          - software-properties-common
          - nginx
        state: present

    - name: Ensure nginx is enabled and started
      service:
        name: nginx
        state: started
        enabled: yes

    # ---------------- Docker ----------------
    - name: Install Docker via official repo
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ user_name }}"
        groups: docker
        append: yes

    # ---------------- MicroK8s ----------------
    - name: Install MicroK8s
      snap:
        name: microk8s
        classic: yes
        channel: "{{ microk8s_channel }}"
        state: present

    - name: Add user to microk8s group
      user:
        name: "{{ user_name }}"
        groups: microk8s
        append: yes

    - name: Ensure kube directory exists
      file:
        path: "{{ user_home }}/.kube"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: "0755"

    - name: Wait for MicroK8s to be ready
      command: microk8s status --wait-ready
      register: microk8s_ready
      retries: 5
      delay: 20
      until: microk8s_ready.rc == 0

    - name: Enable required MicroK8s addons
      command: "microk8s enable {{ item }}"
      loop: "{{ microk8s_addons }}"
      register: addon_enable
      changed_when: "'Nothing to do' not in addon_enable.stdout"
      failed_when: addon_enable.rc != 0

    - name: Verify cluster is running
      command: microk8s kubectl get nodes
      register: cluster_check
      retries: 5
      delay: 10
      until: cluster_check.rc == 0

    # ---------------- AWS CLI ----------------
    - name: Check if AWS CLI is installed
      command: aws --version
      register: aws_check
      changed_when: false
      failed_when: false

    - name: Download AWS CLI
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
      when: aws_check.rc != 0

    - name: Unzip AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes
      when: aws_check.rc != 0

    - name: Install AWS CLI
      command: /tmp/aws/install
      args:
        creates: /usr/local/bin/aws
      when: aws_check.rc != 0

    - name: Cleanup AWS CLI installer
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/aws
        - /tmp/awscliv2.zip
      when: aws_check.rc != 0

    # ---------------- Final Reminder ----------------
    - name: Reminder about group membership
      debug:
        msg: >
          Installation complete. Log out and log back in for docker and microk8s
          group membership to apply.
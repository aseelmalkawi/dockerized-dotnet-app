---
- name: Bootstrap server with MicroK8s and AWS CLI
  hosts: all
  become: true

  vars:
    user_name: "{{ ansible_user }}"
    user_home: "/home/{{ ansible_user }}"

  tasks:

    # ---------------- System ----------------
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - apt-transport-https
          - unzip
          - software-properties-common
        state: present

    # ---------------- Nginx ----------------

    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Ensure nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

    # ---------------- MicroK8s ----------------
    - name: Install MicroK8s
      snap:
        name: microk8s
        classic: yes
        state: present

    - name: Add user to microk8s group
      user:
        name: "{{ user_name }}"
        groups: microk8s
        append: yes

    - name: Wait for Kubernetes API
      command: microk8s kubectl get nodes
      register: kube_check
      retries: 20
      delay: 15
      until: kube_check.rc == 0

    # ---------------- MicroK8s Certificates ----------------
    - name: Get server public IP
      shell: curl -s http://checkip.amazonaws.com | tr -d '[:space:]'
      register: server_public_ip

    - name: Add server public IP to CSR template
      lineinfile:
        path: /var/snap/microk8s/current/certs/csr.conf.template
        insertafter: "IP.2 = .*"
        line: "IP.3 = {{ server_public_ip.stdout }}"
        regexp: "IP.3 ="

    - name: Refresh MicroK8s certificates
      command: microk8s refresh-certs --cert server.crt

    - name: Stop MicroK8s
      command: microk8s stop

    - name: Wait for MicroK8s to stop
      command: microk8s status
      register: stop_check
      retries: 10
      delay: 5
      until: "'microk8s is not running' in stop_check.stdout"
      failed_when: false

    - name: Start MicroK8s
      command: microk8s start

    - name: Wait for Kubernetes API after restart
      command: microk8s kubectl get nodes
      register: kube_check
      retries: 20
      delay: 15
      until: kube_check.rc == 0

    # ---------------- MicroK8s Addons ----------------
    - name: Enable dns addon
      command: microk8s enable dns
      register: dns_result
      changed_when: "'already enabled' not in dns_result.stdout"

    - name: Wait for dns to be ready
      command: microk8s kubectl rollout status deployment/coredns -n kube-system
      register: dns_check
      retries: 10
      delay: 10
      until: dns_check.rc == 0

    - name: Enable ingress addon
      command: microk8s enable ingress
      register: ingress_result
      changed_when: "'already enabled' not in ingress_result.stdout"

    - name: Wait for ingress to be ready
      command: microk8s kubectl rollout status daemonset/nginx-ingress-microk8s-controller -n ingress
      register: ingress_check
      retries: 10
      delay: 10
      until: ingress_check.rc == 0

    # ---------------- Kubeconfig ----------------
    - name: Generate kubeconfig with server public IP
      shell: |
        microk8s config | sed "s/10\.0\.1\.5/{{ ansible_host }}/g"
      register: kubeconfig_output
      
    - name: Save kubeconfig locally
      local_action: copy content="{{ kubeconfig_output.stdout }}" dest="{{ lookup('env', 'GITHUB_WORKSPACE') }}/kubeconfig"

    # ---------------- AWS CLI ----------------
    - name: Check if AWS CLI is installed
      command: aws --version
      register: aws_check
      changed_when: false
      failed_when: false

    - name: Download AWS CLI
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
      when: aws_check.rc != 0

    - name: Unzip AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes
      when: aws_check.rc != 0

    - name: Install AWS CLI
      command: /tmp/aws/install
      args:
        creates: /usr/local/bin/aws
      when: aws_check.rc != 0

    - name: Cleanup AWS CLI installer
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/aws
        - /tmp/awscliv2.zip
      when: aws_check.rc != 0

    # ---------------- Final ----------------
    - name: Remind about group membership
      debug:
        msg: "Bootstrap complete. Re-login for microk8s group membership to apply."
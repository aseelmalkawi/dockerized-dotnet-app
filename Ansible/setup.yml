---
- name: Bootstrap dev machine with Docker, Nginx, MicroK8s, and AWS CLI
  hosts: all
  become: true
  vars:
    user_name: "{{ ansible_facts['user_id'] }}"
    user_home: "{{ ansible_facts['env']['HOME'] }}"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist

    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - apt-transport-https
          - unzip
          - software-properties-common
        state: present

    # ---------------- Docker ----------------
    - name: Check if Docker is installed
      command: docker --version
      register: docker_check
      failed_when: false
      changed_when: false

    - name: Install Docker
      shell: curl -fsSL https://get.docker.com | sh
      when: docker_check.rc != 0

    - name: Add user to docker group
      user:
        name: "{{ user_name }}"
        groups: docker
        append: yes

    # ---------------- Nginx ----------------
    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Enable and start Nginx
      service:
        name: nginx
        enabled: yes
        state: started

    # ---------------- MicroK8s ----------------
    - name: Check if MicroK8s is installed
      command: microk8s status
      register: microk8s_check
      failed_when: false
      changed_when: false

    - name: Install MicroK8s
      snap:
        name: microk8s
        classic: yes
        channel: "1.31/stable"
      when: microk8s_check.rc != 0
      register: microk8s_install

    - name: Refresh MicroK8s to stable channel
      command: snap refresh microk8s --channel=1.31/stable
      when: microk8s_check.rc == 0

    - name: Add user to microk8s group
      user:
        name: "{{ user_name }}"
        groups: microk8s
        append: yes

    - name: Ensure ~/.kube exists
      file:
        path: "{{ user_home }}/.kube"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: "0755"

    - name: Check if MicroK8s is actually running
      command: snap services microk8s
      register: snap_services
      changed_when: false

    - name: Show snap services status
      debug:
        var: snap_services.stdout_lines

    - name: Start MicroK8s if not active
      command: microk8s start
      when: "'inactive' in snap_services.stdout or 'disabled' in snap_services.stdout"
      register: microk8s_manual_start

    - name: Wait a bit after manual start
      pause:
        seconds: 30
      when: microk8s_manual_start.changed

    - name: Try quick status check (non-blocking)
      command: microk8s status
      register: quick_status
      changed_when: false
      failed_when: false
      timeout: 30

    - name: Show quick status
      debug:
        var: quick_status.stdout_lines

    - name: Run microk8s inspect for debugging
      command: microk8s inspect
      register: inspect_output
      when: "'not running' in quick_status.stdout or quick_status.rc != 0"
      failed_when: false
      changed_when: false

    - name: Show inspect output if there's an issue
      debug:
        var: inspect_output.stdout_lines
      when: inspect_output is defined

    - name: Reset MicroK8s if it's stuck
      block:
        - name: Stop MicroK8s
          command: microk8s stop
          timeout: 60

        - name: Wait after stop
          pause:
            seconds: 10

        - name: Start MicroK8s fresh
          command: microk8s start
          timeout: 60

        - name: Wait after fresh start
          pause:
            seconds: 30
      when: "'not running' in quick_status.stdout or quick_status.rc != 0"

    - name: Wait for MicroK8s to be ready (with reasonable timeout)
      command: microk8s status --wait-ready
      timeout: 180
      register: microk8s_ready
      retries: 2
      delay: 30
      until: microk8s_ready.rc == 0
      failed_when: false

    - name: Final status check
      command: microk8s status
      register: final_ready_check
      changed_when: false
      failed_when: false

    - name: Show final status
      debug:
        var: final_ready_check.stdout_lines

    - name: Fail if MicroK8s still not ready
      fail:
        msg: "MicroK8s failed to start properly. Check the inspect output above for details."
      when: "'is not running' in final_ready_check.stdout"

    - name: Ensure MicroK8s is started
      command: microk8s start
      register: microk8s_start
      failed_when: false
      changed_when: "'MicroK8s is running' not in microk8s_start.stdout"

    - name: Wait again for MicroK8s to be ready after start
      command: microk8s status --wait-ready
      timeout: 300
      register: microk8s_ready_final
      retries: 5
      delay: 15
      until: microk8s_ready_final.rc == 0

    - name: Verify MicroK8s is actually running
      command: microk8s status
      register: microk8s_status_check
      changed_when: false
      failed_when: "'is not running' in microk8s_status_check.stdout"

    - name: Get current MicroK8s addon status
      command: microk8s status --format short
      register: addon_status
      changed_when: false
      retries: 3
      delay: 10
      until: addon_status.rc == 0

    - name: Enable dns addon
      command: microk8s enable dns
      when: "'dns: disabled' in addon_status.stdout or 'dns is not available' in addon_status.stdout"
      retries: 3
      delay: 10
      register: dns_enable
      until: dns_enable.rc == 0

    - name: Wait after dns addon
      pause:
        seconds: 15
      when: dns_enable.changed

    - name: Enable registry addon
      command: microk8s enable registry
      when: "'registry: disabled' in addon_status.stdout or 'registry is not available' in addon_status.stdout"
      retries: 3
      delay: 15
      register: registry_enable
      until: registry_enable.rc == 0
      failed_when: false

    - name: Check if registry addon worked
      command: microk8s kubectl get pods -n container-registry
      register: registry_check
      retries: 10
      delay: 10
      until: registry_check.rc == 0
      when: registry_enable.rc == 0
      failed_when: false

    - name: Manual registry recovery if needed
      block:
        - name: Stop microk8s
          command: microk8s stop
          
        - name: Wait for stop
          pause:
            seconds: 10
            
        - name: Start microk8s
          command: microk8s start
          
        - name: Wait for ready after restart
          command: microk8s status --wait-ready
          timeout: 300
          
        - name: Try enabling registry again
          command: microk8s enable registry
          retries: 2
          delay: 15
          register: registry_retry
          until: registry_retry.rc == 0
      when: registry_enable.failed or (registry_check is defined and registry_check.rc != 0)
      ignore_errors: true

    - name: Wait after registry addon
      pause:
        seconds: 15
      when: registry_enable.changed or (registry_retry is defined and registry_retry.changed)

    - name: Enable dashboard addon
      command: microk8s enable dashboard
      when: "'dashboard: disabled' in addon_status.stdout or 'dashboard is not available' in addon_status.stdout"
      retries: 3
      delay: 10
      register: dashboard_enable
      until: dashboard_enable.rc == 0
      failed_when: false

    - name: Enable istio addon
      command: microk8s enable istio
      when: "'istio: disabled' in addon_status.stdout or 'istio is not available' in addon_status.stdout"
      retries: 3
      delay: 10
      register: istio_enable
      until: istio_enable.rc == 0
      ignore_errors: true

    # ---------------- AWS CLI ----------------
    - name: Check if AWS CLI is installed
      command: aws --version
      register: aws_check
      failed_when: false
      changed_when: false

    - name: Download AWS CLI
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
      when: aws_check.rc != 0

    - name: Unzip AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes
      when: aws_check.rc != 0

    - name: Install AWS CLI
      command: /tmp/aws/install
      when: aws_check.rc != 0

    - name: Cleanup AWS CLI install files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/aws
        - /tmp/awscliv2.zip
      when: aws_check.rc != 0

    # ---------------- Final Status ----------------
    - name: Get final MicroK8s status
      command: microk8s status
      register: final_status
      changed_when: false

    - name: Show MicroK8s status
      debug:
        var: final_status.stdout_lines

    - name: Reminder about group changes
      debug:
        msg: >
          Installation complete. Log out and log back in so docker and microk8s
          group changes actually apply. No, Ansible cannot fix that for you.
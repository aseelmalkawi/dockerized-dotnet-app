---
- name: Bootstrap dev machine with Docker, Nginx, MicroK8s, and AWS CLI
  hosts: all
  become: true

  vars:
    user_name: "{{ ansible_user }}"
    user_home: "/home/{{ ansible_user }}"
    microk8s_channel: "1.31/stable"
    microk8s_addons:
      - dns
      - registry
      - dashboard
      - istio

  tasks:

    # ---------------- System ----------------
    - name: Update and upgrade apt packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - apt-transport-https
          - unzip
          - software-properties-common
          - nginx
        state: present

    - name: Ensure nginx is enabled and started
      service:
        name: nginx
        state: started
        enabled: yes

    # ---------------- Docker ----------------
    - name: Install Docker via official repo
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ user_name }}"
        groups: docker
        append: yes

    # ---------------- MicroK8s ----------------
    - name: Install MicroK8s
      snap:
        name: microk8s
        classic: yes
        state: present

    - name: Add user to microk8s group
      user:
        name: "{{ user_name }}"
        groups: microk8s
        append: yes
      become: true

    - name: Wait for Kubernetes API
      command: microk8s kubectl get nodes
      register: kube_check
      retries: 20
      delay: 15
      until: kube_check.rc == 0

    # ---------- Final Cluster Validation ----------
    - name: Validate cluster nodes
      command: microk8s kubectl get nodes
      register: node_check
      retries: 5
      delay: 10
      until: node_check.rc == 0

    # ---------------- MicroK8s Addons ----------------
    - name: Enable dns addon
      command: microk8s enable dns
      register: dns_result
      changed_when: "'already enabled' not in dns_result.stdout"

    - name: Wait for dns to be ready
      command: microk8s kubectl rollout status deployment/coredns -n kube-system
      retries: 10
      delay: 10
      register: dns_check
      until: dns_check.rc == 0

    # ---------------- AWS CLI ----------------
    - name: Check if AWS CLI is installed
      command: aws --version
      register: aws_check
      changed_when: false
      failed_when: false

    - name: Download AWS CLI
      get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
      when: aws_check.rc != 0

    - name: Unzip AWS CLI
      unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: yes
      when: aws_check.rc != 0

    - name: Install AWS CLI
      command: /tmp/aws/install
      args:
        creates: /usr/local/bin/aws
      when: aws_check.rc != 0

    - name: Cleanup AWS CLI installer
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/aws
        - /tmp/awscliv2.zip
      when: aws_check.rc != 0

    # ---------------- Final Reminder ----------------
    - name: Reminder about group membership
      debug:
        msg: >
          Installation complete. Log out and log back in for docker and microk8s
          group membership to apply.
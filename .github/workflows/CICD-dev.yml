name: CICD Dev

on:
    workflow_dispatch:

env:
  S3_BUCKET: "aseelmalkawi"  
  DOTNET_INSTALL_DIR: "/tmp/dotnet"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
    prepare: 
      runs-on: [self-hosted]
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Setup .NET
          uses: actions/setup-dotnet@v3
          with:
            dotnet-version: '7.0.x'

        - name: Extract Version
          run : | 
              chmod +x common/version_extract.sh
              ./common/version_extract.sh

        - name:  Debugging the extracted Version
          run: echo $VERSION

        - name: Upload Version artifact
          uses: actions/upload-artifact@v4
          with:
            name: version
            path: version.yaml

    build:
      runs-on: [self-hosted]
      needs: prepare
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: version

        - name: Load version into enviroment
          run: |
              chmod +x common/load_version.sh
              ./common/load_version.sh

        - name: Setup .NET
          uses: actions/setup-dotnet@v3
          with:
            dotnet-version: '7.0.x'

        - name: Package/Publish app artifact
          run: dotnet publish -c Release -o ./app/publish

        - name: Upload artifact to S3
          run: aws s3 cp ./app/publish s3://${{ env.S3_BUCKET }}/magic-villa/publish/ --recursive

    docker:
        needs: build
        runs-on: [self-hosted]
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                name: version

            - name: Load version into enviroment
              run: |
                chmod +x common/load_version.sh
                ./common/load_version.sh

            - name: Debugging the extracted Version
              run: echo $VERSION

            - name: Load Outputs
              run: |
                chmod +x common/load_outputs.sh
                ./common/load_outputs.sh

            - name: Download app artifact from S3
              run: |
                  aws s3 cp s3://${{ env.S3_BUCKET }}/magic-villa/publish/ ./app/publish/ --recursive
            
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-region: us-east-1
            
            - name: Login into AWS ecr
              uses: aws-actions/amazon-ecr-login@v2
                
            - name: Build and push Image 
              uses: docker/build-push-action@v6 
              with:
                context: .
                file: ./Dockerfile-stage2
                push: true
                tags: ${{ env.ECR_URI }}:${{ env.VERSION }}
      
    deploy:
      runs-on: [self-hosted]
      needs: docker
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4
        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: version

        - name: Load version into enviroment
          run: | 
            chmod +x common/load_version.sh
            ./common/load_version.sh

        - name: Load Outputs
          run: |
            chmod +x common/load_outputs.sh
            ./common/load_outputs.sh

        - name: Deploy via SSM
          run: |
            NGINX_CONF=$(base64 -w 0 default.conf)
            sed "s|\${IMAGE}|${{ env.ECR_URI }}:${{ env.VERSION }}|g" docker-compose.yaml | base64 -w 0 > /tmp/compose_encoded
            COMPOSE_CONTENT=$(cat /tmp/compose_encoded)

            cat > /tmp/ssm-input.json << EOF
            {
              "DocumentName": "AWS-RunShellScript",
              "InstanceIds": ["${{ env.INSTANCE_ID }}"],
              "Parameters": {
                "commands": [
                  "rm -rf /tmp/default.conf /tmp/docker-compose.yml && echo $NGINX_CONF | base64 -d > /tmp/default.conf && echo $COMPOSE_CONTENT | base64 -d > /tmp/docker-compose.yml && aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ env.ECR_URI }} && cd /tmp && docker-compose down --rmi all && docker-compose up -d"
                ]
              }
            }
            EOF

            aws ssm send-command \
              --cli-input-json file:///tmp/ssm-input.json
name: CICD Dev

on:
    workflow_dispatch:

env:
  S3_BUCKET: "aseelmalkawi"  
  DOTNET_INSTALL_DIR: "/tmp/dotnet"

jobs:
    prepare: 
      runs-on: [self-hosted]
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Setup .NET
          uses: actions/setup-dotnet@v3
          with:
            dotnet-version: '7.0.x'
            cache: true

        - name: Extract Version
          run : | 
              chmod +x common/version_extract.sh
              ./common/version_extract.sh

        - name:  Debugging the extracted Version
          run: echo $VERSION

        - name: Upload Version artifact
          uses: actions/upload-artifact@v4
          with:
            name: version
            path: version.yaml

    build:
      runs-on: [self-hosted]
      needs: prepare
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: version

        - name: Load version into enviroment
          run: |
              chmod +x common/load_version.sh
              ./common/load_version.sh

        - name: Setup .NET
          uses: actions/setup-dotnet@v3
          with:
            dotnet-version: '7.0.x'
            cache: true

        - name: Package/Publish app artifact
          run: dotnet publish -c Release -o ./app/publish

        - name: Upload artifact to S3
          run: aws s3 cp ./publish s3://${{ env.S3_BUCKET }}/magic-villa/ --recursive

        - name: Upload build artifacts
          uses: actions/upload-artifact@v4
          with:
            name: app-build
            path: app
    docker:
        needs: build
        runs-on: [self-hosted]
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Download artifact 
              uses: actions/download-artifact@v4
              with:
                name: app-build

            - name: Download artifact
              uses: actions/download-artifact@v4
              with:
                name: version

            - name: Load version into enviroment
              run: |
                chmod +x common/load_version.sh
                ./common/load_version.sh

            - name: Debugging the extracted Version
              run: echo $VERSION

            - name: Load Outputs
              run: |
                chmod +x common/load_outputs.sh
                ./common/load_outputs.sh

            - name: Download app artifact from S3
              run: |
                  mkdir ./publish
                  aws s3 cp s3://${{ env.S3_BUCKET }}/magicvilla/publish ./publish/ --recursive
                
            - name: Login into AWS ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and push Image 
              uses: docker/build-push-action@v6 
              with:
                context: .
                file: ./Dockerfile-stage2
                push: true
                tags: ${{ secrets.ECR_URI }}/${{ env.PROJECT_NAME }}:${{ env.VERSION }}
      

name: Provision & Configure Infra

on:
    workflow_dispatch:

jobs:
    Terraform: 
        runs-on: [self-hosted]
        outputs:
          server_ip: ${{ steps.tf.outputs.server_ip }}
          ecr_url: ${{ steps.tf.outputs.ecr_url }}
        steps:
        - name: Checkout repo
          uses: actions/checkout@v4
        
        - name: Init
          run: |
            cd terraform
            terraform init -backend-config=backend-config.hcl

        - name: Plan
          run: |
            cd terraform
            terraform plan
        
        - name: Apply
          id: tf
          run: |
            cd terraform
            terraform apply -auto-approve -no-color
            echo "server_ip=$(terraform output -no-color -raw ec2_public_ip)" >> $GITHUB_OUTPUT
            echo "ecr_url=$(terraform output -no-color -raw ecr_repository_url)" >> $GITHUB_OUTPUT
        
        - name: Push outputs to GitHub secrets
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            cd terraform
            gh secret set ECR_URI --body "$(terraform output -raw ecr_repository_url)"
            gh secret set EC2_PUBLIC_IP --body "$(terraform output -raw ec2_public_ip)"
    
    Ansible: 
        runs-on: [self-hosted]
        needs: Terraform
        steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Write SSH key
          run: |
            echo "${{ secrets.KEY }}" > /tmp/deploy_key
            chmod 600 /tmp/deploy_key

        - name: Write inventory
          run: |
            printf "all:\n  hosts:\n    my_server:\n      ansible_host: %s\n      ansible_user: ubuntu\n      ansible_ssh_private_key_file: /tmp/deploy_key\n      ansible_ssh_common_args: '-o StrictHostKeyChecking=no'\n" \
              "${{ needs.Terraform.outputs.server_ip }}" > Ansible/inventory.yml

        - name: Debug inventory
          run: cat Ansible/inventory.yml && echo "---" && ansible-inventory -i Ansible/inventory.yml --list

        - name: ansible configuration
          run: |
            ansible-playbook -i Ansible/inventory.yml Ansible/setup.yml
        
        - name: Show deployment info
          run: |
            echo "🎉 Deployment complete!"
            echo "EC2 IP: ${{ needs.Terraform.outputs.server_ip }}"
            echo "ECR URL: ${{ needs.Terraform.outputs.ecr_url }}"
            echo ""
            echo "These values are now available as GitHub secrets:"
            echo "  - TF_ECR_REPOSITORY_URL"
            echo "  - TF_EC2_PUBLIC_IP"
            echo "  - TF_EC2_INSTANCE_ID"
            echo "  - TF_VPC_ID"
            echo "  - TF_SUBNET_ID"
            echo "  - TF_SECURITY_GROUP_ID"
            echo "  - TF_IAM_ROLE_ARN"
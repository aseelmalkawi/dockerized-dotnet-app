name: Create Infra

on:
    workflow_dispatch:

jobs:
    setup: 
        runs-on: [self-hosted]
        steps:
        - name: Checkout repo
          uses: actions/checkout@v4
        
        - name: init
          run: |
            cd terraform
            terraform init -backend-config=backend-config.hcl
            terraform plan
        
        - name: apply
          run: |
            cd terraform
            terraform apply --auto-approve

        - name: Write SSH key
          run: |
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
            chmod 600 /tmp/deploy_key

        - name: ansible configuration
          run: |
            ls
            ansible-playbook -i Ansible/inventory Ansible/setup.yml
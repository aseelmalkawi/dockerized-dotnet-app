name: Create Infra

on:
    workflow_dispatch:

jobs:
    setup: 
        runs-on: [self-hosted, ec2]
        steps:
        - name: Checkout repo
          uses: actions/checkout@v4
        
        - name: init
          run: terraform init
        
        - name: apply
          run: terraform apply

        - name: ansible configuration
          run: ansible-playbook -i Ansible/inventory Ansible/setup.yml
name: CICD Prod

on:
    workflow_dispatch:

env:
  PROJECT_NAME: magic-villa

jobs:
    promote:
      runs-on: [self-hosted]
      outputs:
        BASE_TAG: ${{ steps.promote.outputs.BASE_TAG }}
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name : Config AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-region: us-east-1
            
        - name: Login into AWS ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Load Outputs
          run: |
            chmod +x common/load_outputs.sh
            ./common/load_outputs.sh

        - name: Promote script
          id: promote
          run: |
            chmod +x common/promote.sh
            ./common/promote.sh
      
    deploy:
      runs-on: [self-hosted]
      needs: promote
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Download artifact
          uses: actions/download-artifact@v4
          with:
            name: version

        - name: Load version into enviroment
          run: |
            chmod +x common/load_version.sh
            ./common/load_version.sh

        - name: Load Outputs
          run: |
            chmod +x common/load_outputs.sh
            ./common/load_outputs.sh
        
        # - name: ssm command
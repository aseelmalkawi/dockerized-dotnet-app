services:
  magicvilla:
    build:
      context: .
      dockerfile: Dockerfile-stage2
    container_name: magicvilla
    ports:
      - "8080"
    networks:
      - appnet  
    
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "3000:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - magicvilla
    networks:
      - appnet

networks:
  appnet:
    